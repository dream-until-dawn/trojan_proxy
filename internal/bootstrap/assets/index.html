<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>首次管理员绑定</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>首次管理员绑定</h1><p>仅通过自己的 SSH 隧道操作。材料只显示一次，刷新后需从服务器重新获取令牌。</p>
<form id="begin"><label>本机一次性令牌<input id="token" type="password" autocomplete="off" required></label><label>管理员强口令（16–1024 字节）<input id="password" type="password" autocomplete="new-password" minlength="16" maxlength="1024" required></label><label>再次输入口令<input id="repeat" type="password" autocomplete="new-password" required></label><button>继续绑定验证器</button></form>
<section id="materials" hidden><h2>添加到自己的验证器</h2><p>类型 TOTP，6 位，30 秒。设置密钥：</p><pre id="secret"></pre><details><summary>手动绑定 URI</summary><pre id="uri"></pre></details><h2>离线恢复码</h2><p>每个只能使用一次。请先保存到自己的安全位置。</p><pre id="codes"></pre><form id="finish"><label><input id="saved" type="checkbox" required>已安全保存恢复码和验证器密钥</label><label>当前六位验证码<input id="otp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button>完成绑定</button></form></section><p id="message" role="status"></p></main><script type="module" src="setup.js"></script></body></html>
