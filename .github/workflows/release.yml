name: Publish verified stable distribution
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify modules, release positive and negative tests, and documentation
        run: |
          python3 tools/validate.py
          python3 -m unittest discover -s tools/stability -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 tools/release/check_docs.py
      - name: Bind stable distribution to accepted images and source
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 tools/release/distribution.py --version "$RELEASE_VERSION"
      - name: Publish release and checksum attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            ".work/trojan-proxy-${RELEASE_VERSION}.zip" \
            ".work/trojan-proxy-${RELEASE_VERSION}.zip.sha256" \
            ".work/trojan-proxy-${RELEASE_VERSION}.manifest.json" \
            ".work/trojan-proxy-${RELEASE_VERSION}-source.zip" \
            ".work/trojan-proxy-${RELEASE_VERSION}-source.zip.sha256" \
            --verify-tag --title "Trojan Proxy ${RELEASE_VERSION}" \
            --notes-file ".work/trojan-proxy-${RELEASE_VERSION}.release-notes.txt"
