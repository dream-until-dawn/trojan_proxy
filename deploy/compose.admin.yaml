# M3单独验收后台用，不是最终接管80/443的一键部署包。
services:
  control:
    image: trojan-control:m6
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./admin.proxy.example.json:/etc/trojan-proxy/proxy.json:ro
      - ./data:/data
      - ./run/caddy:/run/caddy:ro
      - ./public:/srv/public:ro
      - ./run/vpn:/run/vpn:ro
      - ./certificates/imported:/certs:ro
      - ./certificates/published:/certificates
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:18090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  vpn-runner:
    image: trojan-runner:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runner
    network_mode: host
    user: "10002:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [--config, /etc/trojan-proxy/proxy.json]
    volumes:
      - ./run/vpn:/run/vpn
      - ./certificates/published:/certificates:ro
      - ./admin.proxy.example.json:/etc/trojan-proxy/proxy.json:ro
    tmpfs:
      - /run/vpn/private:uid=10002,gid=10001,mode=0700
      - /tmp:uid=10002,gid=10001,mode=0700
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  admin-gateway:
    image: trojan-gateway:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    network_mode: host
    user: "0:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile.admin:/etc/caddy/Caddyfile:ro
      - /mnt/trojan/cert/qin-xin.top:/certs:ro
      - ./run/caddy:/run/caddy
    tmpfs: [/data, /config, /tmp]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
